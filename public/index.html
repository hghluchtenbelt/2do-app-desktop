<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2Do List</title>
<link rel="stylesheet" href="style.css">
<script src="confetti.browser.min.js"></script>
</head>
<body>

<div id="toast" class="toast"><span class="toast-icon"></span><span class="toast-text"></span></div>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Projects</h3>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>
  <div class="sidebar-content" id="projectList"></div>
  <div class="sidebar-footer">
    <button class="btn-small" id="newProjectBtn">+ New</button>
  </div>
</aside>

<div class="modal" id="projectModal">
  <div class="modal-content">
    <div class="modal-title" id="projectModalTitle">Create Project</div>

    <div class="modal-field">
      <label>Project name</label>
      <input id="projectName" type="text" placeholder="e.g. Work, Personal..." />
    </div>

    <div class="modal-field">
      <label>Pick icon</label>
      <div class="icon-picker" id="iconPicker"></div>
    </div>

    <div class="modal-field">
      <label>Pick color</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>

    <button id="archiveProjectBtn" class="modal-cancel" style="width:100%; display:none; margin-bottom:12px; background:#fef3c7; color:#92400e;">Archive project</button>

    <div class="modal-actions">
      <button class="modal-cancel" id="cancelProjectBtn">Cancel</button>
      <button class="modal-submit" id="saveProjectBtn">Create</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 style="font-size: 20px; font-weight: 600;">2Do List</h1>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Search tasks..." autocomplete="off" />
        <button id="searchClear" class="search-clear" title="Clear search" style="display:none;">✕</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="active">📋 Active <span id="activeCount">0</span></button>
      <button class="tab" data-tab="timeline">📅 Timeline <span id="timelineCount">0</span></button>
      <button class="tab" data-tab="archive">🗂️ Archive <span id="archiveCount">0</span></button>
      <button class="tab" data-tab="stats">📊 Stats</button>
    </div>

    <div id="addTaskSection" class="add-task">
      <input id="taskInput" placeholder="Add a new task..." autocomplete="off" />
      <select id="projectSelect"></select>
      <select id="prioritySelect" title="Priority">
        <option value="normal">⚪ Normal</option>
        <option value="medium">🟡 Medium</option>
        <option value="high">🔴 High</option>
      </select>
      <select id="dateSelect" title="Due date">
        <option value="">No date</option>
        <option value="today">⚡ Today</option>
        <option value="tomorrow">☀️ Tomorrow</option>
        <option value="nextweek">⏩ Next week</option>
        <option value="custom">📅 Pick a date...</option>
      </select>
      <input id="taskDate" type="date" style="display:none;" />
      <button id="addBtn">+</button>
    </div>

    <div id="activeList"></div>
  </div>
</div>

<div class="modal" id="taskModal">
  <div class="modal-content" style="max-width: 500px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div class="modal-title" style="margin: 0;">Task Details</div>
      <button id="closeTaskModal" style="font-size: 24px; opacity: 0.6;">✕</button>
    </div>

    <div class="modal-field">
      <label>Title</label>
      <input id="taskTitle" type="text" />
    </div>

    <div class="modal-field">
      <label>Notes</label>
      <textarea id="taskNotes" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
    </div>

    <div class="modal-field">
      <label>Priority</label>
      <div style="display: flex; gap: 10px;">
        <button class="priority-btn" data-priority="normal" style="flex: 1;">Normal</button>
        <button class="priority-btn" data-priority="medium" style="flex: 1;">Medium</button>
        <button class="priority-btn" data-priority="high" style="flex: 1;">High</button>
      </div>
    </div>

    <div class="modal-field">
      <label>Due Date</label>
      <input id="taskDateEdit" type="date" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;" />
    </div>

    <div class="modal-field">
      <label>Project</label>
      <select id="taskProject" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer;"></select>
    </div>

    <div class="modal-field">
      <label>Subtasks</label>
      <div id="subtaskList" class="subtask-list"></div>
      <div class="subtask-input-wrap">
        <input id="subtaskInput" type="text" placeholder="Add subtask..." />
        <button id="addSubtaskBtn" title="Add subtask">+</button>
      </div>
    </div>

    <div class="modal-field">
      <label>Links & Documents</label>
      <div id="linksList" style="margin-bottom: 10px;"></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <input id="linkLabel" type="text" placeholder="Label (optional)" style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;" />
        <input id="linkUrl" type="text" placeholder="URL or file path" style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;" />
        <button id="addLinkBtn" style="padding: 10px; background: #f0f0f0; border-radius: 8px; cursor: pointer; font-weight: 600;">+ Add Link</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-cancel" id="deleteTaskBtn" style="background: #fee2e2; color: #dc2626;">Delete</button>
      <button class="modal-submit" id="saveTaskBtn">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
